<header class="home-header">
  <h1 class="title">INÍCIO</h1>
  <span class="spacer"></span>
  <label class="search-wrap" for="search">
    <span class="sr-only">Pesquisar</span>
    <input id="search"
           [formControl]="searchCtrl"
           class="search-input"
           type="text"
           placeholder="Pesquisar" />
  </label>
</header>

<section *ngIf="results().length; else emptyOrLoading" class="grid">
  <article class="card" *ngFor="let c of results(); trackBy: trackById">
<!-- [class.is-fav]="(isFav$ | async) ?? false" -->
    <!-- <button
      type="button"
      class="fav-btn"
      
      [class.is-fav]="(isFav$ | async) ?? false"
      (click)="toggleFavorite(c.id, c)"
      [attr.aria-pressed]="(isFav$ | async) ? 'true' : 'false'"
      [attr.aria-label]="(isFav$ | async) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
      
      <svg viewBox="0 0 24 24" class="heart">
        <path d="M12.1 21.35l-1.1-.98C5.14 15.36 2 12.5 2 8.98 2 6.42 4.03 4.4 6.6 4.4c1.55 0 3.04.72 4 1.86A5.2 5.2 0 0 1 14.6 4.4c2.57 0 4.6 2.02 4.6 4.58 0 3.52-3.14 6.38-8.9 11.39l-1.2.98z"/>
      </svg>
    </button> -->

    <button
      type="button"
      class="fav-btn"
      (click)="toggleFavorite(c.id, c)"
      [class.is-fav]="(isFav(c.id) | async)"
      [attr.aria-pressed]="(isFav(c.id) | async) ? 'true' : 'false'">

      <mat-icon *ngIf="!(isFav(c.id) | async)" fontIcon="heart_check"></mat-icon>
      <mat-icon *ngIf="(isFav(c.id) | async)" fontIcon="favorite"></mat-icon>
      <!-- <mat-icon
        fontIcon="(isFav(c.id) | async) ? 'heart_check' : 'favorite'">
      </mat-icon> -->
    </button>

    <img [src]="c.image" [alt]="c.name" />
    <h2>{{ c.name }}{{ (favoritesIds$ | async) | json }}</h2>
    <p>{{ c.species }}</p>
  </article>
</section>

<ng-template #emptyOrLoading>
  <section class="empty-panel">
    <div class="empty-inner" *ngIf="!loading(); else loadingTpl">
      <h2>Nada foi encontrado</h2>
      <p>Tente realizar uma nova busca.</p>
    </div>
  </section>
</ng-template>

<ng-template #loadingTpl>
  <section class="empty-panel">
    <div class="empty-inner">
      <h2>Carregando…</h2>
      <p>Aguarde um momento.</p>
    </div>
  </section>
</ng-template>
